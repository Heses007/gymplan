<!DOCTYPE html>
<html lang="nl" data-theme="dark" data-accent="sunset" class="sa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Plan">
<meta name="theme-color" content="#08090d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>Gym Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --w04:rgba(255,255,255,.04);--w045:rgba(255,255,255,.045);--w06:rgba(255,255,255,.06);--w07:rgba(255,255,255,.07);--w075:rgba(255,255,255,.075);--w08:rgba(255,255,255,.08);--w09:rgba(255,255,255,.09);--w10:rgba(255,255,255,.1);--w12:rgba(255,255,255,.12);--w18:rgba(255,255,255,.18);--w20:rgba(255,255,255,.2);
  --txt2:#c9cdd6;--eye:#ffd0b5;--sheet:#121319;--navbg:rgba(18,19,25,.72);--float:rgba(20,21,28,.94);--ctabg:#fff;--ctatx:#0b0b10;--bgfx:.33;
  --bg:#08090d;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.075);--stroke:rgba(255,255,255,.08);
  --txt:#f4f5f8;--mut:#8e95a3;--mut2:#5c6370;
  --a1:#ff7a2f;--a2:#ff2e78;--a3:#8b5cff;--ok:#2ee59d;--warn:#ffc94a;
  --grad:linear-gradient(120deg,var(--a1),var(--a2) 55%,var(--a3));
  --r:24px;
  --disp:"Outfit",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 120px);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
/* background glow */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.33}
.bgfx i:nth-child(1){width:340px;height:340px;background:var(--a1);top:-120px;left:-110px}
.bgfx i:nth-child(2){width:300px;height:300px;background:var(--a2);top:120px;right:-170px;opacity:.22}
.bgfx i:nth-child(3){width:380px;height:380px;background:var(--a3);bottom:-200px;left:-60px;opacity:.18}
.bgfx:after{content:"";position:absolute;inset:0;background:radial-gradient(transparent 0,var(--bg) 75%)}

/* type */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.h-xl{font-family:var(--disp);font-size:40px;line-height:1.02;font-weight:700;letter-spacing:-.03em;margin:6px 0 0}
.h-l{font-family:var(--disp);font-size:30px;font-weight:700;letter-spacing:-.025em;margin:4px 0 2px}
.h-s{font-family:var(--disp);font-size:20px;font-weight:600;letter-spacing:-.01em;margin:26px 0 10px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mut{color:var(--mut)}
.small{font-size:13px;color:var(--mut)}

/* cards */
.card{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);padding:18px;margin:12px 0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative}
.card.tight{padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin:0}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-family:var(--disp);font-weight:700;color:#fff;border:0;box-shadow:0 6px 20px rgba(255,46,120,.35)}
.quote{margin:14px 0 6px;font-size:16px;color:var(--txt2);line-height:1.5;border-left:3px solid;border-image:var(--grad) 1;padding-left:12px}

/* hero */
.hero{padding:22px;overflow:hidden;border:0;background:linear-gradient(145deg,color-mix(in srgb,var(--a1) 22%,transparent),color-mix(in srgb,var(--a2) 14%,transparent) 45%,color-mix(in srgb,var(--a3) 16%,transparent));}
.hero:before{content:"";position:absolute;inset:0;border-radius:var(--r);padding:1px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.7;pointer-events:none}
.hero .big{font-family:var(--disp);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:6px 0 4px}
.hero .pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.pill{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--w10);color:var(--txt)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;padding:16px;font-size:16.5px;font-weight:700;background:var(--ctabg);color:var(--ctatx);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s}
.cta:active{transform:scale(.97)}
.cta.grad{background:var(--grad);color:#fff;box-shadow:0 10px 30px rgba(255,46,120,.35)}
.cta.ghost{background:var(--glass2);color:var(--txt);box-shadow:none;border:1px solid var(--stroke)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:16px;font-size:12px;color:var(--mut);font-weight:600}
.wd .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;border:1.5px dashed var(--mut2);color:var(--mut2)}
.wd.plan .dot{border:1.5px solid var(--w18);color:var(--mut)}
.wd.done .dot{background:var(--grad);border:0;color:#fff}
.wd.today{background:var(--glass2);color:var(--txt)}

/* rings */
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-family:var(--disp);font-size:22px;letter-spacing:-.02em}
.ring .val span{font-size:11px;color:var(--mut)}
.ring circle{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}

.tile{display:flex;flex-direction:column;gap:6px;min-height:118px;justify-content:space-between;text-align:left;border:1px solid var(--stroke);background:var(--glass);border-radius:var(--r);padding:16px;color:var(--txt);width:100%}
.tile .ic{font-size:24px}
.tile b{font-family:var(--disp);font-size:20px;letter-spacing:-.02em}
.tile.on{background:linear-gradient(140deg,rgba(46,229,157,.22),rgba(46,229,157,.06));border-color:rgba(46,229,157,.4)}

/* lists */
.li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--stroke)}
.li:last-child{border-bottom:0}
.check{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--w20);display:grid;place-items:center;font-size:14px;font-weight:900;color:#fff;transition:all .2s}
.li.done .check{background:var(--ok);border-color:var(--ok);color:#06210f}
.li.done .t1{color:var(--mut);text-decoration:line-through}
.t1{font-weight:650}
.t2{font-size:13.5px;color:var(--mut);margin-top:2px}
.time{font-size:11.5px;font-weight:800;letter-spacing:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.chev{margin-left:auto;color:var(--mut2);font-size:20px}

/* chips & segments */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--stroke);background:var(--glass);border-radius:16px;padding:10px 14px;text-align:left;min-width:92px}
.chip b{display:block;font-family:var(--disp);font-size:16px}
.chip span{font-size:12px;color:var(--mut)}
.chip.on{background:var(--grad);border-color:transparent}
.chip.on span{color:rgba(255,255,255,.85)}
.seg{display:flex;background:var(--glass);border:1px solid var(--stroke);border-radius:16px;padding:4px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:12px;font-weight:650;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--glass2);color:var(--txt);box-shadow:0 2px 10px rgba(0,0,0,.3)}

/* progress bar */
.bar{height:8px;background:var(--w07);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* exercise */
.ex .num{width:30px;height:30px;border-radius:10px;background:var(--glass2);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:14px;flex:0 0 auto}
.ex .name{font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.ex .meta{font-size:13px;color:var(--mut);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:10px;background:var(--glass2);margin-top:12px}
.badge.up{background:rgba(46,229,157,.16);color:var(--ok)}
.prev{font-size:13px;color:var(--mut);margin-top:8px}
.tipx{font-size:13px;color:var(--txt2);margin-top:6px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;margin-top:14px;align-items:center}
.sets .h{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--mut2);text-transform:uppercase}
.sets .n{font-size:13px;color:var(--mut);text-align:center;font-weight:700}
.sets input{width:100%;background:var(--w06);border:1px solid var(--stroke);color:var(--txt);border-radius:12px;padding:11px 10px;font-size:17px;font-weight:650;text-align:center;font-family:var(--disp);-moz-appearance:textfield}
.sets input::-webkit-outer-spin-button,.sets input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sets input:focus{outline:none;border-color:var(--a2);background:rgba(255,46,120,.08)}
.sets input::placeholder{color:var(--mut2)}
.sbtn{height:44px;border-radius:12px;border:1px solid var(--stroke);background:var(--w04);display:grid;place-items:center;font-size:18px;color:var(--mut2);transition:all .2s}
.sbtn.on{background:var(--ok);border-color:var(--ok);color:#06210f;font-weight:900}
.setrow-done input{opacity:.65}

/* deals */
.deal{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--stroke)}
.deal:last-child{border-bottom:0}
.deal .disc{flex:0 0 54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:15px;color:#fff;background:var(--grad);text-align:center;line-height:1.05;padding:2px}
.deal .disc.ah{background:linear-gradient(140deg,#00a0e2,#0062c4)}
.deal .disc.dirk{background:linear-gradient(140deg,#e30613,#a1000b)}
.deal .pr{margin-left:auto;text-align:right;flex:0 0 auto}
.deal .pr b{font-family:var(--disp);font-size:18px;display:block}
.deal .pr s{font-size:12px;color:var(--mut2)}
.fit{display:inline-block;font-size:11.5px;font-weight:650;color:var(--ok);margin-top:4px}

/* nav */
nav{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);height:66px;background:var(--navbg);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--w09);border-radius:24px;display:flex;padding:6px;z-index:20;box-shadow:0 20px 50px rgba(0,0,0,.5)}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:10.5px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;transition:all .2s}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--txt);background:var(--w08)}
nav button.on svg{stroke:url(#ng)}

/* views */
section.v{display:none}
section.v.show{display:block;animation:fadeUp .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(7){animation-delay:.3s}.stagger>*:nth-child(8){animation-delay:.35s}.stagger>*:nth-child(9){animation-delay:.4s}

/* timer pill */
#timer{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 88px);transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:25;display:flex;align-items:center;gap:10px;background:var(--float);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--w12);border-radius:99px;padding:8px 8px 8px 18px;box-shadow:0 14px 40px rgba(0,0,0,.5);transition:all .3s cubic-bezier(.2,.8,.2,1)}
#timer.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#timer .tt{font-family:var(--disp);font-size:22px;font-weight:700;min-width:58px;font-variant-numeric:tabular-nums}
#timer .tl{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
#timer button{border:0;background:var(--glass2);border-radius:99px;padding:9px 13px;font-weight:700;font-size:13px}
#timer.ready{background:linear-gradient(120deg,#16b97a,#2ee59d);border-color:transparent;color:#06210f}
#timer.ready .tl{color:#06210f}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
#scrim.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--sheet);border-radius:28px 28px 0 0;border-top:1px solid var(--w10);padding:10px 20px calc(env(safe-area-inset-bottom) + 28px);transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.2,1);z-index:31}
#sheet.show{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--w20);margin:4px auto 14px}
#sheet ul{padding-left:18px;margin:6px 0}#sheet li{margin:5px 0;color:var(--txt2)}

/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translate(-50%,-20px);opacity:0;background:var(--float);border:1px solid var(--w12);padding:11px 18px;border-radius:99px;font-weight:650;font-size:14px;z-index:40;transition:all .3s;pointer-events:none;backdrop-filter:blur(20px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--glass2);border-radius:18px;padding:14px 8px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:24px;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--mut)}
.winput{flex:1;background:var(--w06);border:1px solid var(--stroke);color:var(--txt);border-radius:14px;padding:13px 14px;font-size:17px;font-family:var(--disp);font-weight:600}
.winput:focus{outline:none;border-color:var(--a2)}
.plus{border:0;border-radius:14px;width:52px;height:50px;background:var(--grad);color:#fff;font-size:24px;font-weight:700}
.hist{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--stroke);font-size:14.5px}
.hist:last-child{border:0}
.sync{font-size:11px;color:var(--mut2);text-align:center;margin-top:18px}
.done-hero{text-align:center;padding:10px 0 4px}
.done-hero .big{font-size:64px;line-height:1;margin-bottom:6px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.linkrow{display:flex;gap:10px;margin-top:12px}
.linkrow a{flex:1;text-align:center;text-decoration:none;font-weight:650;font-size:14px;padding:12px;border-radius:14px;background:var(--glass2);border:1px solid var(--stroke)}

/* v3 additions */
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.field input,.field textarea,.field select{background:var(--w06);border:1px solid var(--stroke);color:var(--txt);border-radius:14px;padding:13px 14px;font-size:16px;font-family:inherit;width:100%}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--a2)}
.field textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.f2 .field,.f3 .field{margin:6px 0}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid var(--stroke);background:var(--glass);border-radius:16px;padding:13px 15px;font-weight:650}
.opt span{font-size:12.5px;color:var(--mut);font-weight:500}
.opt.on{border-color:transparent;background:linear-gradient(120deg,color-mix(in srgb,var(--a1) 25%,transparent),color-mix(in srgb,var(--a2) 20%,transparent),color-mix(in srgb,var(--a3) 20%,transparent));box-shadow:inset 0 0 0 1.5px var(--a2)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.slot{position:relative;aspect-ratio:3/4;border-radius:16px;border:1.5px dashed var(--w18);background:var(--glass);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mut);text-align:center;overflow:hidden;cursor:pointer;padding:4px}
.slot b{font-size:20px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.has{border-style:solid;border-color:var(--a2)}
.slot .lbl{position:absolute;left:4px;right:4px;bottom:4px;background:rgba(0,0,0,.6);border-radius:8px;padding:2px;color:#fff;font-weight:650}
.slot input{display:none}
.res h4{font-family:var(--disp);font-size:16px;margin:16px 0 6px}
.res ul{padding-left:18px;margin:4px 0}.res li{margin:5px 0;color:var(--txt2)}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:rgba(255,201,74,.14);color:var(--warn);font-weight:700;font-size:13px;margin:4px 6px 0 0}
.badge.focus{background:rgba(255,201,74,.14);color:var(--warn)}
.loader{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;color:var(--mut)}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--w08);border-top-color:var(--a2);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prof{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:1px solid var(--stroke);background:var(--glass);margin:8px 0;width:100%;text-align:left}
.prof.on{box-shadow:inset 0 0 0 1.5px var(--a2)}
.prof .avatar{width:38px;height:38px;font-size:15px;box-shadow:none}
.bonus{display:inline-block;font-size:11.5px;font-weight:700;color:#4fc3ff;margin-top:3px}
.qty{font-size:13px;color:var(--mut);margin-top:2px}
.note{font-size:13px;color:var(--txt2);background:var(--glass2);border-radius:14px;padding:12px 14px;margin:10px 0}
.danger{color:#ff6b6b!important}
textarea.backup{width:100%;min-height:90px;background:var(--w06);border:1px solid var(--stroke);color:var(--txt);border-radius:14px;padding:12px;font-size:12px;font-family:ui-monospace,monospace}

[data-theme=light]{--bg:#f2f3f7;--glass:rgba(255,255,255,.86);--glass2:rgba(20,24,40,.055);--stroke:rgba(20,24,40,.08);--txt:#14161c;--mut:#5f6673;--mut2:#9aa0ab;--txt2:#3b404b;--eye:var(--a2);

const $=id=>document.getElementById(id);
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dk(new Date());
const MND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const fmtD=k=>{const [y,m,d]=k.split('-');return +d+' '+MND[+m-1];};
const range=r=>r.split('–').map(Number);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1900);}
function dayOfYear(){const n=new Date(),s=new Date(n.getFullYear(),0,0);return Math.floor((n-s)/864e5);}
function todayDay(){return DAYS.find(d=>d.wd===new Date().getDay());}
function restSec(r){if(/superset/.test(r))return 0;const n=(r.match(/\d+/g)||[]).map(Number);if(!n.length)return 90;const a=n.reduce((x,y)=>x+y,0)/n.length;return /min/.test(r)?Math.round(a*60):a;}
function ring(pct,size,stroke,grad,big,small){const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.min(1,Math.max(0,pct)));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" style="stroke:var(--w08)" stroke-width="${stroke}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="url(#${grad})" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/></svg><div class="val"><b>${big}</b><span>${small}</span></div></div>`;}
function animateRings(root){requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelectorAll('circle[data-off]').forEach(c=>c.style.strokeDashoffset=c.dataset.off)));}
/* per-profiel oefening */
function exKg(ex){if(!ex.kg)return 0;const inc=ex.inc||2.5;let v=Math.round(ex.kg*PL.r/inc)*inc;if(ex.bar)v=Math.max(20,v);return Math.max(inc,+v.toFixed(1));}
function isFocus(ex){return (INFO.focus||[]).includes(ex.m);}
function exS(ex){return ex.s+(isFocus(ex)?1:0);}
function lastLog(dayId,i,excl){const keys=Object.keys(S.logs).filter(k=>k.endsWith('|'+dayId)&&k.split('|')[0]!==excl).sort().reverse();
  for(const k of keys){const sets=(S.logs[k][i]||[]).filter(s=>s&&s.reps);if(sets.length)return{date:k.split('|')[0],sets};}return null;}
function suggest(ex,dayId,i){const L=lastLog(dayId,i,today());if(!L)return{kg:exKg(ex),up:false,L};
  const hi=range(ex.r)[1];const top=Math.max(...L.sets.map(s=>+s.kg||0));const ts=L.sets.filter(s=>(+s.kg||0)===top);
  const n=Math.min(ex.s,exS(ex));const all=L.sets.length>=n&&ts.length>=n&&ts.every(s=>+s.reps>=hi);
  return{kg:all?+(top+ex.inc).toFixed(1):top,up:all&&ex.inc>0,L};}
function dayStats(key){const log=S.logs[key];if(!log)return{sets:0,vol:0};let sets=0,vol=0;Object.values(log).forEach(a=>(a||[]).forEach(s=>{if(s&&s.reps){sets++;vol+=(+s.kg||0)*(+s.reps);}}));return{sets,vol:Math.round(vol)};}
function trainedOn(date){return Object.keys(S.logs).some(k=>k.startsWith(date+'|')&&dayStats(k).sets>0);}
function creaStreak(){let n=0;const d=new Date();if(!S.crea[dk(d)])d.setDate(d.getDate()-1);while(S.crea[dk(d)]&&n<999){n++;d.setDate(d.getDate()-1);}return n;}
/* voeding per profiel */
function rnd(q,u){if(u==='g'||u==='ml')return Math.max(10,Math.round(q/10)*10);return Math.max(1,Math.round(q));}
function mealText(m){return m.it.map(([q,u,n,sc])=>{const v=sc?rnd(q*PL.f,u):q;return v+' '+(u?u+' ':'')+n;}).join(' · ')+(m.x?' · '+m.x:'');}
function mealK(m){return Math.round((m.k+(PL.f-1)*m.ks)/5)*5;}
function mealP(m){return Math.round(m.p+(PL.f-1)*m.ps);}
const KCAL=()=>MEALS.reduce((a,m)=>a+mealK(m),0);
function foodToday(){const m=S.meals[today()]||{};let k=0,p=0,c=0;MEALS.forEach(x=>{if(m[x.id]){k+=mealK(x);p+=mealP(x);c++;}});return{k,p,c,m};}

  const W=S.weights.slice().sort((a,b)=>a.d<b.d?-1:1);const start=INFO.w;

  else{const w=330,h=150,px=10,py=18;const vals=pts.map(x=>x.kg);const mn=Math.min(...vals)-0.4,mx=Math.max(...vals)+0.4;

    const line=pts.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(x.kg).toFixed(1)).join(' ');const area=line+` L${X(pts.length-1)},${h} L${X(0)},${h} Z`;
    const cur=W[W.length-1].kg,dif=cur-start;const good=INFO.goal==='cut'?dif<=0:dif>=0;

     <svg viewBox="0 0 ${w} ${h}" width="100%" style="margin-top:8px"><path d="${area}" fill="url(#area)"/><path d="${line}" fill="none" stroke="url(#rg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.kg)}" r="${i===pts.length-1?5:3}" style="fill:${i===pts.length-1?'var(--txt)':'var(--a2)'}"/>`).join('')}</svg>`;}
  let adv='';
  if(W.length>=2){const a=W[Math.max(0,W.length-4)],b=W[W.length-1];const days=Math.max(1,(new Date(b.d)-new Date(a.d))/864e5);const pw=(b.kg-a.kg)/days*7;const t=nl(pw.toFixed(2));
    if(INFO.goal==='bulk')adv=`Tempo: ${pw>=0?'+':''}${t} kg/week. `+(pw<0.15?'Te langzaam: eet ± 200 kcal meer (glas melk + pindakaas).':pw>0.6?'Te snel: eet ± 200 kcal minder (krentenbollen weg).':'Perfect tempo ✅');
    else if(INFO.goal==='cut')adv=`Tempo: ${t} kg/week. `+(pw>-0.2?'Te langzaam: eet ± 200 kcal minder.':pw<-0.8?'Te snel: eet ± 200 kcal meer om spier te behouden.':'Perfect tempo ✅');
    else adv=`Tempo: ${t} kg/week. `+(Math.abs(pw)<0.25?'Stabiel, precies goed voor een recomp ✅':'Pas je eten ± 200 kcal aan om stabiel te blijven.');}
  $('wAdvice').textContent=adv;
  const keys=Object.keys(S.logs).filter(k=>dayStats(k).sets);const totVol=keys.reduce((a,k)=>a+dayStats(k).vol,0);
  $('progStats').innerHTML=`<div class="stat"><b>${keys.length}</b><span>trainingen</span></div><div class="stat"><b>${nl((totVol/1000).toFixed(1))}t</b><span>totaal volume</span></div><div class="stat"><b>${creaStreak()}</b><span>creatine-reeks</span></div>`;
  const pr={};keys.forEach(k=>{const D=DAYS.find(d=>d.id===k.split('|')[1]);if(!D)return;Object.entries(S.logs[k]).forEach(([i,sets])=>{const ex=D.ex[i];if(!ex)return;(sets||[]).forEach(s=>{if(!s||!s.reps)return;const e1=(+s.kg||0)*(1+s.reps/30);if(!pr[ex.n]||e1>pr[ex.n].e1)pr[ex.n]={e1,kg:s.kg||0,reps:s.reps};});});});
  const names=Object.keys(pr).sort((a,b)=>pr[b].e1-pr[a].e1);
  $('prList').innerHTML=names.length?names.map(n=>`<div class="hist"><span>${n}</span><b style="font-family:var(--disp)">${nl(pr[n].kg)} kg × ${pr[n].reps}</b></div>`).join(''):'<div class="hist"><span class="mut">Je records verschijnen hier na je eerste training.</span></div>';
  $('histList').innerHTML=keys.length?keys.sort().reverse().slice(0,30).map(k=>{const [d,id]=k.split('|');const D=DAYS.find(x=>x.id===id);const st=dayStats(k);return `<div class="hist"><span>${fmtD(d)} · <b>${D?D.name:id}</b></span><span class="mut">${st.sets} sets · ${st.vol.toLocaleString('nl-NL')} kg</span></div>`;}).join(''):'<div class="hist"><span class="mut">Nog geen trainingen.</span></div>';
}

async function shrink(file){const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});

 DAYS.forEach(d=>L.push(`${d.short} ${d.name}: `+d.ex.map((e,i)=>{const sg=suggest(e,d.id,i);return `${e.n} ${exS(e)}x${e.r} @${sg.kg?sg.kg+'kg':'lichaamsgewicht'}`;}).join('; ')));
 const keys=Object.keys(S.logs).filter(k=>dayStats(k).sets).sort().reverse().slice(0,8);
 if(keys.length){L.push('Laatst gelogde trainingen (kg x reps):');keys.forEach(k=>{const [d,id]=k.split('|');const Dd=DAYS.find(x=>x.id===id);if(!Dd)return;
   const parts=Object.entries(S.logs[k]).map(([i,sets])=>{const ex=Dd.ex[i];const ss=(sets||[]).filter(s=>s&&s.reps);return ex&&ss.length?ex.n+' '+ss.map(s=>(s.kg||0)+'x'+s.reps).join(','):null;}).filter(Boolean);
   L.push(`- ${d} ${Dd.name}: `+parts.join('; '));});}
 else L.push('Nog geen trainingen gelogd.');
 const W=S.weights.slice().sort((a,b)=>a.d<b.d?-1:1).slice(-6);if(W.length)L.push('Gewicht: '+W.map(w=>w.d+' '+w.kg+' kg').join(', '));
 const c=(S.checkins||[])[0];if(c)L.push(`Laatste body check-in (${c.d}): ${c.samenvatting} Aandachtspunten: ${(c.aandacht||[]).join('; ')}`);
 return L.join('\n');
}
const COACH_RULES=`Je bent de personal trainer in de app "Gym Plan": een ervaren, warme en directe coach voor natuurlijke spieropbouw, kracht, voeding en herstel. Je schrijft Nederlands en spreekt de sporter aan met "je".
- Antwoord kort en praktisch, geschikt voor een telefoonscherm: meestal 2 tot 6 zinnen of een korte lijst met "- ". Gebruik **vet** spaarzaam. Geen tabellen of koppen.
- Gebruik de gegevens van de sporter hieronder en verwijs er concreet naar (gewichten, trainingen, schema). Verzin geen gegevens die er niet staan; vraag het als je iets mist.
- Het schema en voedingsplan staan vast in de app; stel aanpassingen in woorden voor (bv. "vervang X door Y", "doe 1 set extra").
- Bij producten: bij voorkeur Albert Heijn (huismerk), goedkoop en makkelijk.
- Geen medische diagnoses. Bij gewrichtspijn, scherpe pijn, duizeligheid, borstpijn of blessures: stop die oefening en raad een fysio of huisarts aan.
- Geen advies over anabole steroïden, SARMs of andere prestatieverhogende middelen, geen extreme diëten of uitdrogen. Zie je signalen van een eetstoornis, reageer dan vriendelijk, zonder getallen, en raad de huisarts aan.
- Creatine monohydraat 3–5 g per dag is prima; andere supplementen nuchter en kort bespreken.`;
function mdLite(t){const h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)_(.+?)_(?=\s|$)/g,'$1<i>$2</i>');const out=[];let ul=false;
 h.split('\n').forEach(l=>{const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);if(m){if(!ul){out.push('<ul>');ul=true;}out.push('<li>'+m[1]+'</li>');}else{if(ul){out.push('</ul>');ul=false;}if(l.trim())out.push('<p>'+l+'</p>');}});
 if(ul)out.push('</ul>');return out.join('');}
function renderCoach(){
  const box=$('coachBody');if(!box||!hasProfile())return;S.chat=S.chat||[];
  let html=`<div class="coachhead"><div class="coachav">🏋️</div><div style="flex:1"><div class="eyebrow">Personal trainer</div><div class="h-l" style="margin:0">Coach</div></div>${S.chat.length?'<button id="chatNew" style="border:0;background:none;color:var(--a2);font-weight:700;font-size:14px">Nieuw gesprek</button>':''}</div>`;
  if(SAMPLE===null){html+=`<div class="card" style="margin-top:16px"><div class="t1">🔒 De coach werkt alleen als je bent ingelogd bij Claude</div><div class="t2" style="margin-top:6px">De rest van de app werkt gewoon zonder account. Wil je de coach gebruiken? Maak een gratis account op claude.ai en open de app daarna opnieuw.</div></div>`;box.innerHTML=html;$('composer').style.display='none';return;}
  $('composer').style.display='flex';
  html+='<div class="msgs" id="msgs">';
  if(!S.chat.length)html+=`<div class="msg ai"><p>Hoi ${esc(INFO.name)}! 👋 Ik ben je personal trainer. Ik ken je schema, je gewichten en je voeding. Vraag me alles over training, techniek, voeding of herstel.</p></div><div class="sugg">${SUGG.map(s=>`<button data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
  html+=S.chat.map(m=>`<div class="msg ${m.r==='user'?'me':'ai'}">${m.r==='user'?esc(m.c).replace(/\n/g,'<br>'):mdLite(m.c)}</div>`).join('')+'</div>';
  box.innerHTML=html;
}
function scrollChat(){window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}
function autoGrow(){const t=$('chatIn');t.style.height='auto';t.style.height=Math.min(120,t.scrollHeight)+'px';}
let coachCtl=null;
async function sendCoach(q){
  if(coachBusy){if(coachCtl)coachCtl.abort();return;}
  q=(q||'').trim();if(!q)return;
  coachBusy=true;setSendBtn(true);
  const sample=SAMPLE===undefined?await samplePromise:SAMPLE;
  if(!sample){coachBusy=false;setSendBtn(false);renderCoach();return;}
  S.chat.push({r:'user',c:q});S.chat=S.chat.slice(-40);save();
  $('chatIn').value='';autoGrow();renderCoach();
  const bub=document.createElement('div');bub.className='msg ai';$('msgs').appendChild(bub);scrollChat();
  let tick=waitTicker(bub,'<span class="typing"><i></i><i></i><i></i></span>');
  let hist=S.chat.slice(-12).map(m=>({role:m.r==='user'?'user':'assistant',content:m.c}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  hist.unshift({role:'user',content:COACH_RULES+'\n\n=== GEGEVENS VAN DE SPORTER ===\n'+coachContext()+'\n=== EINDE GEGEVENS ==='});
  let text='';coachCtl=new AbortController();
  try{const r=await sample(hist,{modelTier:'quick',cache:false,signal:coachCtl.signal,onText:({text:t})=>{if(tick){clearInterval(tick);tick=null;}text=t;bub.innerHTML=mdLite(t);}});text=(r&&r.text)||text;}
  catch(e){text=(e&&e.text)?e.text+(e.code==='cancelled'?'\n\n_(gestopt)_':''):(e&&e.code==='cancelled'?'(gestopt)':aiErr(e));}
  finally{if(tick)clearInterval(tick);coachBusy=false;coachCtl=null;setSendBtn(false);}
  S.chat.push({r:'ai',c:text||'…'});save();renderCoach();scrollChat();
}
function setSendBtn(busy){const b=$('chatSend');b.textContent=busy?'■':'↑';b.setAttribute('aria-label',busy?'Stop':'Verstuur');}
$('coachBody').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b)return sendCoach(b.dataset.q);if(e.target.closest('#chatNew')){S.chat=[];save();renderCoach();}});
$('chatSend').addEventListener('click',()=>sendCoach($('chatIn').value));
$('chatIn').addEventListener('input',autoGrow);
samplePromise.then(()=>{if($('v-coach').classList.contains('show'))renderCoach();});

/* ================= INFO ================= */
function openInfo(){openSheet(`<div class="h-l">Zo werkt <span class="gt">jouw plan</span></div>
 <div class="card"><div class="t1">📅 Weekritme</div><ul><li>Ma Upper · Di Lower · Wo Push · Do Pull · Vr Legs</li><li>Weekend = rust. Dan groeien je spieren.</li><li>Elke spiergroep 2× per week, optimaal voor groei.</li><li>Elke 8 weken een lichtere week: halve sets, zelfde gewicht.</li></ul></div>
 <div class="card"><div class="t1">📈 Progressie (het belangrijkste!)</div><ul><li>Elke oefening heeft een bereik, bv. 8–10 reps.</li><li>Haal je bij alle sets de bovenkant? Dan ga je de volgende keer zwaarder: barbell +2,5, dumbbells +2, machines +5 kg. De app laat het groen zien.</li><li>Niet gehaald? Zelfde gewicht, 1 rep meer proberen.</li><li>Stop elke set met nog 1–2 reps over.</li></ul></div>
 <div class="card"><div class="t1">⚖️ Startgewichten</div><ul><li>Geschat op basis van je profiel (ervaring of dumbbell press).</li><li>Week 1 = kalibreren: te makkelijk? Omhoog. Haal je de onderkant niet? Omlaag.</li><li>Machines verschillen per gym, dus zie die getallen als richtlijn.</li></ul></div>
 <div class="card claude-only"><div class="t1">📸 Body check-in</div><ul><li>Upload zo vaak als je wilt foto's (voor, zij, achter). Elke 3–4 weken is ideaal.</li><li>Je krijgt advies over wat achterloopt. Met "Focus toepassen" krijgen die spiergroepen +1 set.</li><li>Foto's worden niet bewaard, alleen het advies.</li><li>Werkt alleen als je bent ingelogd bij Claude.</li></ul></div>
 <div class="card claude-only"><div class="t1">💬 Coach</div><ul><li>Je personal trainer kent je schema, je gelogde trainingen, je gewicht en je voeding.</li><li>Vraag alles: techniek, een oefening vervangen, wat te eten, spierpijn, minder tijd.</li><li>Werkt alleen als je bent ingelogd bij Claude.</li></ul></div>
 <div class="card"><div class="t1">💊 Creatine</div><ul><li>Elke dag 5 g creatine monohydraat, ook in het weekend.</li><li>Tijdstip maakt niet uit. Geen laadfase nodig.</li><li>1–2 kg erbij in het begin is water in je spier. Normaal.</li></ul></div>
 <div class="card"><div class="t1">📱 Jouw gegevens</div><ul><li>Alles wordt op je eigen telefoon bewaard. Je hebt geen account nodig.</li><li>Zet de app op je beginscherm: Safari → deelknop → Zet op beginscherm. Open hem altijd zo.</li><li>Maak af en toe een backup via je profiel (tik op je letter rechtsboven).</li></ul></div>
 <div class="small" style="margin:8px 2px 16px">Geen medisch advies. Bij blessures of klachten eerst naar een arts of fysio.</div>
 <button class="cta grad" data-close>Let's go 💪</button>`);}

/* ================= NAV ================= */
function go(v){
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  document.querySelectorAll('section.v').forEach(s=>s.classList.toggle('show',s.id==='v-'+v));
  if(v==='home')renderHome();if(v==='train')renderTrain();if(v==='food')renderFood();if(v==='deals')renderDeals();if(v==='prog')renderProg();if(v==='coach'){renderCoach();setTimeout(scrollChat,50);}
  try{history.replaceState(null,'','#'+v);}catch(e){}
  window.scrollTo(0,0);
}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v);});
function renderAll(){renderHome();renderTrain();renderFood();renderDeals();renderProg();renderCoach();}
renderAll();
const hv=(location.hash||'').slice(1);if(['train','food','deals','prog','coach'].includes(hv))go(hv);
if(!hasProfile())setTimeout(()=>{if(!hasProfile())profileForm({name:'',age:'',h:'',w:'',goal:'bulk',exp:'mid',db:0,focus:[]},true);},1200);
setInterval(()=>{if($('v-home').classList.contains('show')&&!document.activeElement.matches('input'))renderHome();},60000);
